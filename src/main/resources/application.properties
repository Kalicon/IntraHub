# --- 1. CONFIGURAÇÃO DO SERVIDOR ---
# Mudamos para 8080 para garantir que rode na porta padrao
server.port=8080

# --- 2. BANCO DE DADOS (H2 - Ambiente de Desenvolvimento) ---
spring.datasource.url=jdbc:h2:file:./data/intrahubdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${H2_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o console web do H2 para visualização dos dados
spring.h2.console.enabled=true

# --- 3. REGRAS DE CRIAÇÃO (IMPORTANTE) ---
# 'update' = Cria as tabelas se não existirem, e atualiza se houver mudanças nas entidades.
#            Mantém os dados entre reinicializações (no H2 em modo arquivo, mas em memória apaga).
spring.jpa.hibernate.ddl-auto=update

# --- CONFIGURAÇÕES DO BANCO DE DADOS (PostgreSQL - Ambiente de Produção) ---
# Comentado para usar H2 no desenvolvimento
# spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Corinthians1}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- 4. CONFIGURAÇÕES TÉCNICAS (Hibernate) ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Essencial para não dar erro ao salvar PDFs e Fotos no Postgres
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- 5. UPLOADS (Permite arquivos grandes de até 50MB) ---
server.tomcat.max-http-post-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- 6. E-MAIL (Necessário para não dar erro nos Controllers) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=naorespondahmlmb@gmail.com
# Senha de aplicativo (App Password)
spring.mail.password=${SPRING_MAIL_PASSWORD:fglg rmyl qpui uhpz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- 7. WEB ---
server.error.include-message=always
spring.thymeleaf.cache=false

# --- 8. CONFIGURAÇÕES PERSONALIZADAS (IntraHub) ---
app.mail.admin-destination=${APP_MAIL_ADMIN_DESTINATION:admin@intrahub.com}

# --- 9. SEGURANÇA DE SESSÃO E COOKIES (OWASP Hardening) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=INTRAHUB_SESSION