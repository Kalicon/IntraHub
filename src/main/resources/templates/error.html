<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops! Algo deu errado - IntraHub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary: #0080ff;
            --dark-bg: #090e14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-muted: #8a96a3;
        }

        body {
            background: radial-gradient(at 50% 0%, rgba(231, 74, 59, 0.1) 0px, transparent 50%),
                        radial-gradient(at 0% 100%, rgba(0, 128, 255, 0.08) 0px, transparent 50%),
                        var(--dark-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .error-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            padding: 3rem 2.5rem;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #ff6b6b 0%, #e74a3b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .error-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .btn-home {
            background: linear-gradient(135deg, var(--primary) 0%, #0066cc 100%);
            color: #fff;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 128, 255, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="mb-3">
        <img src="/logo.png" alt="IntraHub Logo" style="width: 54px; height: 54px; object-fit: contain; border-radius: 12px;">
    </div>
    
    <div class="error-code" th:text="${status != null ? status : '500'}">500</div>
    <h3 class="error-title" th:text="${error != null ? error : 'Ops! Ocorreu um Erro'}">Ops! Ocorreu um Erro</h3>
    <p class="error-desc" th:text="${message != null ? message : 'Desculpe, ocorreu uma falha inesperada durante a execução da sua requisição.'}">
        Desculpe, ocorreu uma falha inesperada durante a execução da sua requisição.
    </p>

    <a href="/" class="btn-home">
        <i class="bi bi-house-door-fill"></i> Voltar para a Página Inicial
    </a>
</div>

</body>
</html>
