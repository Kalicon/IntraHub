<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - CorpHub</title>
    
    <!-- Google Fonts: Plus Jakarta Sans for premium UI feel -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary: #0080ff;
            --primary-hover: #0056b3;
            --success: #1cc88a;
            --success-hover: #17a673;
            --dark-bg: #090e14;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-muted: #8a96a3;
        }

        body {
            background: radial-gradient(at 0% 0%, rgba(0, 128, 255, 0.12) 0px, transparent 45%),
                        radial-gradient(at 100% 0%, rgba(28, 200, 138, 0.08) 0px, transparent 40%),
                        radial-gradient(at 50% 100%, rgba(102, 16, 242, 0.08) 0px, transparent 50%),
                        var(--dark-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Ambient glowing circles */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(150px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
        }
        .glow-1 { top: 20%; left: 20%; }
        .glow-2 { bottom: 20%; right: 20%; background: var(--success); }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 15px;
            animation: fadeIn 0.8s ease-out;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            padding: 2.5rem 2.2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 60px -10px rgba(0, 128, 255, 0.15);
            border-color: rgba(0, 128, 255, 0.25);
        }

        .logo-container {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }
        .logo-container:hover {
            transform: scale(1.05) rotate(2deg);
        }
        .logo-img {
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .welcome-title {
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, #ffffff 0%, #dbeafe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.6rem;
        }

        .welcome-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* Modern floating labels */
        .form-floating {
            margin-bottom: 1rem;
        }
        .form-floating > .form-control {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 12px;
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        .form-floating > .form-control:focus {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 128, 255, 0.2);
            color: #ffffff;
        }
        .form-floating > label {
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: var(--primary);
            opacity: 0.8;
        }

        /* Premium Buttons */
        .btn {
            border-radius: 12px;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.2px;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #0066cc 100%);
            border: none;
            box-shadow: 0 4px 15px rgba(0, 128, 255, 0.3);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0090ff 0%, var(--primary-hover) 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 128, 255, 0.45);
        }
        .btn-outline-success {
            color: var(--success);
            border-color: rgba(28, 200, 138, 0.3);
            background: rgba(28, 200, 138, 0.02);
        }
        .btn-outline-success:hover {
            color: #ffffff;
            background: linear-gradient(135deg, var(--success) 0%, var(--success-hover) 100%);
            border-color: transparent;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(28, 200, 138, 0.3);
        }

        .btn-visitante {
            color: var(--text-muted);
            text-decoration: none;
            margin-top: 1.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .btn-visitante:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Alerts */
        .alert {
            border-radius: 12px;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 1rem;
            animation: slideUp 0.3s ease;
        }
        .alert-danger {
            background: rgba(231, 74, 59, 0.15);
            color: #ff8080;
            border: 1px solid rgba(231, 74, 59, 0.2);
        }
        .alert-info {
            background: rgba(54, 185, 204, 0.15);
            color: #80e5ff;
            border: 1px solid rgba(54, 185, 204, 0.2);
        }

        /* Modal styling */
        .modal-content {
            background-color: #0f1722;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            color: #ffffff;
            backdrop-filter: blur(25px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        .modal-header {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 1.5rem 1.8rem;
        }
        .modal-body {
            padding: 1.8rem;
        }
        .modal-footer {
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 1.2rem 1.8rem;
        }
        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 0.5rem;
        }
        .avatar-upload {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px dashed rgba(255,255,255,0.25);
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.02);
        }
        .avatar-upload:hover {
            border-color: var(--success);
            background: rgba(28, 200, 138, 0.05);
            transform: scale(1.02);
        }
        .modal-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .form-control-sm {
            background-color: rgba(255,255,255,0.03) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            color: #fff !important;
            border-radius: 8px !important;
            padding: 0.5rem 0.75rem !important;
        }
        .form-control-sm:focus {
            border-color: var(--success) !important;
            box-shadow: 0 0 0 3px rgba(28, 200, 138, 0.2) !important;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Background Ambient Glows -->
<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<div class="login-wrapper">
    <div class="login-card">
        <!-- SaaS Styled Icon Logo -->
        <img src="/logo.png" alt="CorpHub Logo" class="mb-4 shadow-sm" style="width: 70px; height: 70px; object-fit: contain; border-radius: 16px;">
        
        <h5 class="welcome-title">CorpHub</h5>
        <div class="welcome-subtitle">Plataforma Unificada de Gestão Corporativa</div>

        <form th:action="@{/login}" method="post">
            <div class="form-floating">
                <input type="text" name="username" class="form-control" id="u" placeholder="User" required>
                <label for="u"><i class="bi bi-person me-2"></i>Usuário</label>
            </div>
            
            <div class="form-floating">
                <input type="password" name="password" class="form-control" id="p" placeholder="Senha" required>
                <label for="p"><i class="bi bi-lock me-2"></i>Senha</label>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 fw-bold mb-3 mt-1">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
            </button>
        </form>

        <button class="btn btn-outline-success w-100 fw-bold" data-bs-toggle="modal" data-bs-target="#modalRegistro">
            <i class="bi bi-person-plus me-2"></i>Criar Conta
        </button>

        <!-- Dynamic Feedback messages -->
        <div id="alertError" class="alert alert-danger py-2.5 small" style="display:none;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>Login inválido ou aguardando aprovação do administrador.
        </div>
        
        <div th:if="${param.logout}" class="alert alert-info py-2.5 small">
            <i class="bi bi-info-circle-fill me-2"></i>Sessão encerrada com sucesso.
        </div>
        
        <a href="/" class="btn-visitante">
            <i class="bi bi-eye"></i>Acessar como Visitante
        </a>
    </div>
</div>

<!-- Modal for Requesting Access / Sign Up -->
<div class="modal fade" id="modalRegistro" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold d-flex align-items-center text-success">
                    <i class="bi bi-shield-plus me-2 fs-4"></i>Solicitar Acesso
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="text-center mb-3">
                    <div class="avatar-container">
                        <img id="previewAvatar" src="https://via.placeholder.com/90?text=Foto" class="avatar-upload" onclick="document.getElementById('regFoto').click()">
                    </div>
                    <div class="small text-muted mt-1" style="font-size:0.75rem">Toque para adicionar foto de perfil</div>
                    <input type="file" id="regFoto" class="d-none" onchange="lerFoto()">
                    <input type="hidden" id="base64Foto">
                </div>

                <div class="modal-section-title text-success">Dados de Acesso</div>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <input type="text" id="regLogin" class="form-control form-control-sm" placeholder="Nome de usuário">
                    </div>
                    <div class="col-6">
                        <input type="password" id="regSenha" class="form-control form-control-sm" placeholder="Senha">
                    </div>
                </div>

                <div class="modal-section-title text-primary">Perfil Profissional</div>
                <input type="text" id="regNome" class="form-control form-control-sm mb-2" placeholder="Nome Completo">
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <input type="text" id="regRamal" class="form-control form-control-sm" placeholder="Ramal de contato">
                    </div>
                    <div class="col-6">
                        <input type="text" id="regSetor" class="form-control form-control-sm" placeholder="Setor (ex: UTI)">
                    </div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <input type="text" id="regCargo" class="form-control form-control-sm" placeholder="Cargo (ex: Enfermeiro)">
                    </div>
                    <div class="col-6">
                        <input type="date" id="regNasc" class="form-control form-control-sm" title="Data de Nascimento">
                    </div>
                </div>
                <input type="email" id="regEmail" class="form-control form-control-sm" placeholder="E-mail profissional (opcional)">
            </div>
            <div class="modal-footer">
                <button class="btn btn-success w-100 py-2.5 fw-bold" onclick="enviarCadastro()">
                    <i class="bi bi-send-check me-2"></i>Enviar Solicitação
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Detecta erro na URL (?error)
    if(window.location.search.includes('error')) document.getElementById('alertError').style.display = 'block';

    function lerFoto() {
        const file = document.getElementById('regFoto').files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('previewAvatar').src = e.target.result;
                document.getElementById('base64Foto').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    async function enviarCadastro() {
        const d = {
            login: document.getElementById('regLogin').value,
            senha: document.getElementById('regSenha').value,
            nome: document.getElementById('regNome').value,
            ramal: document.getElementById('regRamal').value,
            setor: document.getElementById('regSetor').value,
            cargo: document.getElementById('regCargo').value,
            dataNascimento: document.getElementById('regNasc').value,
            email: document.getElementById('regEmail').value,
            foto: document.getElementById('base64Foto').value
        };

        if(!d.login || !d.senha || !d.nome) {
            alert("Preencha Login, Senha e Nome!");
            return;
        }

        try {
            const r = await fetch('/auth/registrar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(d)
            });

            if(r.ok) {
                alert("Cadastro enviado! Aguarde a aprovação do TI para logar.");
                const modal = bootstrap.Modal.getInstance(document.getElementById('modalRegistro'));
                modal.hide();
            } else {
                alert(await r.text());
            }
        } catch(e) {
            alert("Erro ao conectar.");
        }
    }
</script>
</body>
</html>
